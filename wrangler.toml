name = "laverdad-softphone"
main = "worker.js"
compatibility_date = "2026-10-26"
workers_dev = true

[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "laverdad-softphone-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
